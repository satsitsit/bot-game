name: Jalankan Ngumpul

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ngumpul
  cancel-in-progress: true

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Server, tunnel, dan bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python server.py &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cf
          chmod +x cf
          ./cf tunnel --no-autoupdate --url http://127.0.0.1:8080 > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Tunnel gagal jalan. Log terakhir:"
            grep -v 'trycloudflare' cf.log | tail -n 20
            exit 1
          fi
          echo "Tunnel siap, bot jalan"
          WEBAPP_URL="$URL" python bot.py