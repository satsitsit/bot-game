name: Jalankan Ngumpul

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ngumpul
  cancel-in-progress: true

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Server, tunnel, dan bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python server.py &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done

          find_url() {
            grep -oE 'https://[a-z0-9-]+\.(lhr\.life|localhost\.run)' tunnel.log | grep -v 'https://admin\.' | head -1
          }

          URL=""
          for attempt in 1 2 3; do
            rm -f tunnel.log
            ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
                -o ExitOnForwardFailure=yes \
                -R 80:127.0.0.1:8080 nokey@localhost.run > tunnel.log 2>&1 &
            TPID=$!
            for i in $(seq 1 30); do
              URL=$(find_url || true)
              [ -n "$URL" ] && break
              kill -0 "$TPID" 2>/dev/null || break
              sleep 2
            done
            [ -n "$URL" ] && break
            kill "$TPID" 2>/dev/null || true
            echo "Percobaan $attempt belum berhasil, coba lagi..."
            sleep 10
          done

          if [ -z "$URL" ]; then
            echo "Tunnel gagal. Log terakhir:"
            tail -n 20 tunnel.log
            exit 1
          fi
          echo "Tunnel siap, bot jalan"
          WEBAPP_URL="$URL" python bot.py