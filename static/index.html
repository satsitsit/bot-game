<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ngumpul</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1538;--paper:#fff4de;--card:#fffdf7;--tomato:#ff5b4a;--sun:#ffc233;--teal:#20b8a0;--sky:#5aa9ff;--plum:#8b5cf6;--display:"Lilita One",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--paper)}
body{font:600 16px/1.4 var(--body);color:var(--ink);min-height:100vh;padding:calc(env(safe-area-inset-top) + 16px) 16px 24px;background-color:var(--paper);background-image:radial-gradient(rgba(29,21,56,.12) 1px,transparent 1px);background-size:22px 22px}
main{max-width:520px;margin:0 auto}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#splash{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--tomato);text-align:center}
.logo{font:400 68px/1 var(--display);color:var(--ink);text-shadow:4px 4px 0 var(--paper);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.tag{margin-top:16px;font-weight:800}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
#link{position:fixed;top:calc(env(safe-area-inset-top) + 16px);right:16px;z-index:8;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--sun)}
#link.on{background:var(--teal)}
#toast{position:fixed;z-index:9;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);max-width:90vw;padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:800;text-align:center;box-shadow:4px 4px 0 var(--tomato)}
.top{padding-top:6px}
h1{font:400 46px/1 var(--display);text-shadow:3px 3px 0 var(--sun)}
.lead{margin-top:10px;font-weight:800;opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.box{display:flex;flex-direction:column;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;cursor:pointer;transition:transform .08s,box-shadow .08s}
.box:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.box:disabled{opacity:.55;cursor:default}
.art{height:86px;display:grid;place-items:center;font-size:42px;border-bottom:3px solid var(--ink)}
.txt{display:flex;flex-direction:column;gap:4px;padding:10px 12px 12px}
.txt b{font:400 19px/1.1 var(--display)}
.txt small{font-size:13px;line-height:1.3;opacity:.75}
.chip{align-self:flex-start;margin-top:4px;font-size:12px;font-weight:800;padding:2px 9px;border:2px solid var(--ink);border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;font:400 18px/1 var(--display);color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:4px 4px 0 var(--ink)}
.join{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--ink)}
.join div{max-width:520px;margin:0 auto;display:flex;gap:10px}
.join input{flex:1;min-width:0;height:50px;padding:0 10px;border:3px solid var(--sun);border-radius:14px;background:var(--paper);font:400 24px var(--display);letter-spacing:.2em;text-align:center}
.join input::placeholder{font:600 16px var(--body);letter-spacing:0;color:rgba(29,21,56,.5)}
#home{padding-bottom:120px}
.card{margin-top:20px;padding:20px;text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink)}
.card h2{font:400 28px/1.1 var(--display);margin-bottom:8px}
.card p{margin-bottom:12px;opacity:.85}
.gname{margin-top:14px;font:400 30px/1.1 var(--display);text-shadow:3px 3px 0 var(--sun)}
.code{display:block;width:100%;margin:4px 0;background:none;border:0;font:400 56px/1 var(--display);letter-spacing:.14em;text-indent:.14em;cursor:pointer}
.status{margin-top:18px;text-align:center;font-weight:800;font-size:17px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin-top:14px}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:800}
.seat span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:400 24px/1 var(--display)}
.av.empty{background:none;border:3px dashed rgba(29,21,56,.35);box-shadow:none}
.dim{opacity:.5}
.note{margin-top:8px;text-align:center;opacity:.8}
.acts{display:grid;gap:10px;margin-top:20px}
.acts .btn{width:100%}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite" hidden></div>
<span id="link" aria-label="Menyambung"></span>

<section id="splash">
  <div><div class="logo">Ngumpul</div><p class="tag">Main bareng teman di Telegram</p></div>
</section>

<main>
  <section id="home" hidden>
    <header class="top"><h1>Ngumpul</h1></header>
    <p class="lead">Pilih game, buat room, lalu ajak teman.</p>
    <div class="grid" id="games"></div>
    <form class="join" id="joinForm">
      <div>
        <input id="join" maxlength="5" placeholder="Kode room" aria-label="Kode room" autocomplete="off" autocapitalize="characters">
        <button class="btn" type="submit">Gabung</button>
      </div>
    </form>
  </section>

  <section id="lobby" hidden>
    <h1 class="gname" id="gname"></h1>
    <div class="card">
      <p>Kode room</p>
      <button class="code" id="code" aria-label="Salin kode room"></button>
      <p>Tap kode untuk menyalin</p>
    </div>
    <p class="status" id="status"></p>
    <div class="seats" id="seats"></div>
    <p class="note" id="note"></p>
    <div class="acts">
      <button class="btn" id="start">Mulai game</button>
      <button class="btn ghost" id="share">Ajak teman</button>
      <button class="btn ghost" id="leave">Keluar room</button>
    </div>
  </section>

  <section id="gate" hidden>
    <div class="card">
      <h2>Belum bisa masuk</h2>
      <p id="gmsg"></p>
      <button class="btn" id="retry">Coba lagi</button>
    </div>
  </section>
</main>

<script>
const GAMES=[
 {id:"ludo",n:"Ludo",e:"🎲",d:"Keliling papan, jegal bidak teman",min:2,max:4,c:"var(--tomato)"},
 {id:"werewolf",n:"Werewolf",e:"🐺",d:"Cari serigala di antara warga",min:5,max:12,c:"var(--sky)"},
 {id:"tod",n:"Truth or Dare",e:"🍾",d:"Putar botol, pilih jujur atau berani",min:2,max:10,c:"var(--sun)"},
 {id:"monyet",n:"Tiga Monyet Bijak",e:"🙈",d:"Buta, tuli, bisu. Selesaikan bareng",min:3,max:3,c:"var(--teal)"},
 {id:"gunung",n:"Panjat Gunung",e:"⛰️",d:"Lompat sampai puncak, balapan",min:2,max:8,c:"var(--plum)"},
 {id:"distrik",n:"Distrik Bayangan",e:"🔦",d:"Satu pemburu lawan survivor",min:2,max:6,c:"var(--tomato)"}
];
const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;
const AV=["var(--teal)","var(--sun)","var(--sky)","var(--paper)","var(--tomato)"];
const S={splash:$("splash"),home:$("home"),lobby:$("lobby"),gate:$("gate")};
let ws,me=null,bot="",room=null,fatal=false,tries=0,pending=false,retryT,toastT;

const hap=s=>{try{tg.HapticFeedback.impactOccurred(s)}catch(e){}};
function show(v){
  for(const k in S)S[k].hidden=k!==v;
  try{v==="lobby"?tg.BackButton.show():tg.BackButton.hide()}catch(e){}
}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function send(o){if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function gate(m){fatal=true;$("gmsg").textContent=m;show("gate")}
function setLink(on){const l=$("link");l.classList.toggle("on",on);l.setAttribute("aria-label",on?"Tersambung":"Menyambung ulang")}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Kode disalin"),()=>toast("Kode room: "+t))}
function lock(on){document.querySelectorAll(".box").forEach(b=>b.disabled=on)}

$("games").replaceChildren(...GAMES.map(g=>{
  const b=document.createElement("button");
  b.className="box";
  b.innerHTML=`<span class="art" style="background:${g.c}">${g.e}</span><span class="txt"><b>${g.n}</b><small>${g.d}</small><span class="chip">${g.min}–${g.max} pemain</span></span>`;
  b.onclick=()=>{
    if(pending)return;
    pending=true;hap("light");lock(true);
    if(!send({t:"create",game:g.id})){pending=false;lock(false);toast("Belum tersambung")}
  };
  return b;
}));

function render(){
  const g=GAMES.find(x=>x.id===room.game), host=room.host===me, n=room.players.length;
  $("gname").textContent=g.e+" "+g.n;
  $("code").textContent=room.code;
  $("seats").replaceChildren(...Array.from({length:g.max},(_,i)=>{
    const p=room.players[i], s=document.createElement("div"), a=document.createElement("div"), t=document.createElement("span");
    s.className="seat";
    a.className="av"+(p?"":" empty");
    if(p){a.style.background=AV[i%AV.length];a.textContent=[...p.name][0]||"?"}
    t.textContent=p?(p.id===room.host?"👑 ":"")+p.name+(p.id===me?" (kamu)":"")+(p.on?"":" (putus)"):"Kosong";
    if(!p||!p.on)t.className="dim";
    s.append(a,t);return s;
  }));
  $("status").textContent=`${n} dari ${g.max} pemain. Minimal ${g.min} untuk mulai.`;
  $("start").hidden=!host||room.started;
  $("start").disabled=n<g.min;
  $("note").textContent=room.started
    ?`${g.n} sudah dimulai. Layar game-nya sedang dibuat, jadi sekarang baru lobinya yang bisa dipakai.`
    :host?(n<g.min?"Tunggu teman masuk pakai kode di atas.":"Sudah cukup. Tekan Mulai game kalau semua siap.")
    :"Menunggu tuan rumah memulai game.";
}

function connect(){
  ws=new WebSocket(location.origin.replace(/^http/,"ws")+"/ws");
  ws.onopen=()=>send({t:"auth",initData:tg.initData});
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==="ready"){
      me=m.me;bot=m.bot||"";tries=0;setLink(true);
      const want=room?room.code:(tg.initDataUnsafe.start_param||new URLSearchParams(location.search).get("code")||"").replace(/^room_/,"").toUpperCase();
      if(want)send({t:"join",code:want});else show("home");
    }
    else if(m.t==="room"){room=m;pending=false;lock(false);render();show("lobby")}
    else if(m.t==="left"){room=null;show("home")}
    else if(m.t==="error"){pending=false;lock(false);toast(m.m);if(m.c==="notfound")room=null;if(!room)show("home")}
    else if(m.t==="fatal")gate(m.m);
  };
  ws.onclose=()=>{
    setLink(false);
    if(fatal)return;
    clearTimeout(retryT);
    retryT=setTimeout(connect,Math.min(1500*++tries,8000));
  };
}

function leaveRoom(){hap("light");if(!send({t:"leave"}))toast("Belum tersambung")}
$("start").onclick=()=>{hap("medium");send({t:"start"})};
$("leave").onclick=leaveRoom;
$("code").onclick=()=>{hap("light");copy(room.code)};
$("share").onclick=()=>{
  hap("light");
  const g=GAMES.find(x=>x.id===room.game);
  const text=`Ayo main ${g.n} di Ngumpul! Kode room: ${room.code}`;
  const link=bot?`https://t.me/${bot}?start=room_${room.code}`:"";
  try{tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`)}catch(e){copy(room.code)}
};
$("joinForm").onsubmit=e=>{
  e.preventDefault();
  const c=$("join").value.trim().toUpperCase();
  if(c.length!==5)return toast("Kodenya harus 5 karakter");
  hap("light");
  if(!send({t:"join",code:c}))toast("Belum tersambung");
};
$("join").oninput=e=>{e.target.value=e.target.value.toUpperCase()};
$("retry").onclick=()=>location.reload();

show("splash");
if(tg&&tg.initData){
  tg.ready();tg.expand();
  try{tg.setHeaderColor("#fff4de");tg.setBackgroundColor("#fff4de")}catch(e){}
  try{tg.BackButton.onClick(()=>{if(room)leaveRoom()})}catch(e){}
  connect();
  setTimeout(()=>{if(me===null&&!fatal)gate("Belum tersambung. Cek koneksi lalu coba lagi.")},8000);
}else gate("Buka Ngumpul lewat bot Telegram ya.");
</script>
</body>
</html>
