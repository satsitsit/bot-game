<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ngumpul</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1446;--bg2:#120c2e;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--text:#f6f3ff;--muted:rgba(246,243,255,.62);--gold:#ffc83d;--gold2:#ff9f1c;--ok:#5be38a;--warn:#ffd166;--display:"Baloo 2",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font:600 16px/1.45 var(--body);color:var(--text);min-height:100vh;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 28px)}
section:not([hidden]){animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
.logo{font:800 46px/1 var(--display);color:var(--gold);margin-top:14px}
.tag{color:var(--muted);font-weight:700}
.bar{width:140px;height:4px;margin-top:30px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;width:40%;height:100%;border-radius:4px;background:var(--gold);animation:load 1.3s ease-in-out infinite}

#welcome{display:flex;flex-direction:column;min-height:calc(100vh - 80px)}
.skip{align-self:flex-end;padding:8px 4px;background:none;border:0;color:var(--muted);font:700 15px var(--body);cursor:pointer}
#wview{flex:1;overflow:hidden}
#track{display:flex;transition:transform .35s ease}
.slide{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 8px 8px;min-height:360px}
.hero{width:132px;height:132px;margin-bottom:30px;display:grid;place-items:center;font-size:58px;border-radius:36px;background:var(--card);border:1px solid var(--line)}
.slide h2{font:800 28px/1.15 var(--display);margin-bottom:10px}
.slide p{max-width:300px;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:8px;margin:26px 0 22px}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:22px;background:var(--gold)}

.hello{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.hello b{display:block;font:800 24px/1.1 var(--display)}
.hello small{color:var(--muted);font-weight:700}
.icon{margin-left:auto;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:800 18px var(--display);cursor:pointer}
.av{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:50%;color:#2a1700;font:800 20px/1 var(--display)}
h3{margin:28px 0 12px;font:800 18px/1.2 var(--display)}
.game{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:10px;padding:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer}
.game:active{background:rgba(255,255,255,.12)}
.game:disabled{opacity:.5;cursor:default}
.gico{flex:none;width:52px;height:52px;display:grid;place-items:center;font-size:26px;border-radius:16px;background:var(--c)}
.gtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gtxt b{font:800 18px/1.15 var(--display)}
.gtxt small{color:var(--muted);font-size:13px;line-height:1.3}
.gtxt em{font-style:normal;font-size:12px;font-weight:800;color:var(--gold);margin-top:2px}
.game:disabled .gtxt em{color:var(--muted)}
.go{font:800 26px/1 var(--display);color:var(--muted)}
.joinbox{display:flex;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.joinbox input{flex:1;min-width:0;height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.18);font:800 20px var(--display);letter-spacing:.18em;text-align:center}
.joinbox input::placeholder{font:600 15px var(--body);letter-spacing:0;color:var(--muted)}
.joinbox .btn{width:auto;min-width:96px;min-height:50px;box-shadow:none}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:0 20px;border:0;border-radius:16px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1700;font:800 17px/1 var(--display);cursor:pointer;box-shadow:0 8px 20px rgba(255,159,28,.22)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.link{background:none;color:var(--muted);box-shadow:none;min-height:44px;font:700 15px var(--body)}

.top{display:flex;align-items:center;margin-bottom:18px}
.top h1{font:800 28px/1.1 var(--display)}
.codecard{padding:22px 16px 18px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px}
.codecard small{color:var(--muted);font-weight:700}
.code{display:block;width:100%;margin:6px 0 16px;background:none;border:0;font:800 46px/1 var(--display);letter-spacing:.2em;text-indent:.2em;cursor:pointer}
.row{display:flex;gap:10px}
.row .btn{min-height:46px;font-size:15px}
.status{margin-top:22px;text-align:center;font-weight:700;color:var(--muted)}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;margin-top:18px}
.seat{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:700}
.seat span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .av{width:56px;height:56px;font-size:22px}
.av.empty{background:none;border:2px dashed var(--line)}
.av.host,.av.turn{box-shadow:0 0 0 3px var(--gold)}
.dim{opacity:.45}
.note{margin-top:16px;text-align:center;color:var(--muted)}
.acts{display:grid;gap:8px;margin-top:26px}

.round{margin-bottom:14px;color:var(--muted);font-weight:700}
.turncard{padding:24px 18px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px}
.turnname{font:800 28px/1.1 var(--display)}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.choose .btn{min-height:66px;font-size:20px}
.kind{display:inline-block;margin-top:14px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.12);font-weight:800;font-size:13px}
.prompt{margin:14px 0 18px;font:700 20px/1.35 var(--body)}
.wait{margin-top:16px;color:var(--muted);font-weight:700}

.card{margin-top:40px;padding:24px 20px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px}
.card h2{font:800 26px/1.1 var(--display);margin-bottom:8px}
.card p{margin-bottom:20px;color:var(--muted)}
#toast{position:fixed;z-index:9;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);max-width:88vw;padding:10px 16px;border-radius:14px;background:#2d2360;border:1px solid var(--line);font-weight:700;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.35)}
#link{position:fixed;z-index:8;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:10px;height:10px;border-radius:50%;background:var(--warn)}
#link.on{background:var(--ok)}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite" hidden></div>
<span id="link" aria-label="Menyambung"></span>

<section id="splash">
  <svg width="112" height="88" viewBox="0 0 112 88" aria-hidden="true">
    <rect x="6" y="14" width="44" height="62" rx="10" fill="#ff6b6b" transform="rotate(-14 28 45)"/>
    <rect x="34" y="8" width="44" height="62" rx="10" fill="#4dabf7" transform="rotate(3 56 39)"/>
    <rect x="60" y="16" width="44" height="62" rx="10" fill="#ffc83d" transform="rotate(16 82 47)"/>
  </svg>
  <div class="logo">Ngumpul</div>
  <p class="tag">Main bareng teman di Telegram</p>
  <div class="bar"><i></i></div>
</section>

<main>
  <section id="welcome" hidden>
    <button class="skip" id="skip">Lewati</button>
    <div id="wview"><div id="track"></div></div>
    <div class="dots" id="dots"></div>
    <button class="btn" id="next">Lanjut</button>
  </section>

  <section id="home" hidden>
    <div class="hello">
      <div class="av" id="av"></div>
      <div><b id="hi"></b><small>Mau main apa hari ini?</small></div>
      <button class="icon" id="help" aria-label="Lihat cara main">?</button>
    </div>
    <h3>Pilih game</h3>
    <div id="glist"></div>
    <h3>Punya kode room?</h3>
    <form class="joinbox" id="joinForm">
      <input id="join" maxlength="5" placeholder="Kode room" aria-label="Kode room" autocomplete="off" autocapitalize="characters">
      <button class="btn" type="submit">Gabung</button>
    </form>
  </section>

  <section id="lobby" hidden>
    <div class="top"><h1 id="gname"></h1></div>
    <div class="codecard">
      <small>Kode room</small>
      <button class="code" id="code" aria-label="Salin kode room"></button>
      <div class="row">
        <button class="btn ghost" id="copy">Salin kode</button>
        <button class="btn" id="share">Ajak teman</button>
      </div>
    </div>
    <p class="status" id="status"></p>
    <div class="seats" id="seats"></div>
    <p class="note" id="note"></p>
    <div class="acts">
      <button class="btn" id="start">Mulai game</button>
      <button class="btn link" id="leave">Keluar room</button>
    </div>
  </section>

  <section id="play" hidden>
    <div class="top"><h1 id="pgame"></h1></div>
    <p class="round" id="pround"></p>
    <div class="turncard">
      <p class="turnname" id="pturn"></p>
      <div class="choose" id="pchoose" hidden>
        <button class="btn" id="tk">Jujur</button>
        <button class="btn" id="dr">Berani</button>
      </div>
      <div id="panswer" hidden>
        <span class="kind" id="pkind"></span>
        <p class="prompt" id="pprompt"></p>
        <button class="btn" id="pdone">Sudah selesai</button>
      </div>
      <p class="wait" id="pwait"></p>
    </div>
    <div class="seats" id="pseats"></div>
    <div class="acts">
      <button class="btn ghost" id="pskip">Lewati giliran</button>
      <button class="btn ghost" id="pend">Akhiri game</button>
      <button class="btn link" id="pleave">Keluar room</button>
    </div>
  </section>

  <section id="gate" hidden>
    <div class="card">
      <h2>Belum bisa masuk</h2>
      <p id="gmsg"></p>
      <button class="btn" id="retry">Coba lagi</button>
    </div>
  </section>
</main>

<script>
const GAMES=[
 {id:"tod",n:"Truth or Dare",e:"🍾",d:"Putar botol, jawab jujur atau berani",min:2,max:10,c:"#ff6b6b",ok:true},
 {id:"ludo",n:"Ludo",e:"🎲",d:"Keliling papan, jegal bidak teman",min:2,max:4,c:"#4dabf7"},
 {id:"werewolf",n:"Werewolf",e:"🐺",d:"Cari serigala di antara warga",min:5,max:12,c:"#b197fc"},
 {id:"monyet",n:"Tiga Monyet Bijak",e:"🙈",d:"Buta, tuli, bisu. Selesaikan bareng",min:3,max:3,c:"#51cf66"},
 {id:"gunung",n:"Panjat Gunung",e:"⛰️",d:"Lompat sampai puncak, balapan",min:2,max:8,c:"#ffd43b"},
 {id:"distrik",n:"Distrik Bayangan",e:"🔦",d:"Satu pemburu lawan survivor",min:2,max:6,c:"#ff922b"}
];
const SL=[
 ["🎮","Selamat datang di Ngumpul","Main game bareng teman langsung dari Telegram, tanpa install apa pun."],
 ["🔗","Buat room, ajak teman","Buat room lalu bagikan link. Teman tinggal tap dan langsung masuk."],
 ["🍾","Mulai dari Truth or Dare","Game lain sedang disiapkan. Pantau terus ya."]
];
const AV=["#ffc83d","#4dabf7","#ff6b6b","#51cf66","#b197fc"];
const $=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;
const S={splash:$("splash"),welcome:$("welcome"),home:$("home"),lobby:$("lobby"),play:$("play"),gate:$("gate")};
let ws,me=null,bot="",room=null,fatal=false,tries=0,pending=false,si=0,tx=null,retryT,toastT;
const SEEN="ngumpul_intro";

const hap=s=>{try{tg.HapticFeedback.impactOccurred(s)}catch(e){}};
const cur=()=>Object.keys(S).find(k=>!S[k].hidden);
function show(v){
  for(const k in S)S[k].hidden=k!==v;
  try{v==="lobby"||v==="play"?tg.BackButton.show():tg.BackButton.hide()}catch(e){}
}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function send(o){if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function gate(m){fatal=true;$("gmsg").textContent=m;show("gate")}
function setLink(on){const l=$("link");l.classList.toggle("on",on);l.setAttribute("aria-label",on?"Tersambung":"Menyambung ulang")}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Kode disalin"),()=>toast("Kode room: "+t))}
function lock(on){document.querySelectorAll(".game").forEach(b=>{if(b.dataset.ok)b.disabled=on})}
const seen=()=>{try{return localStorage.getItem(SEEN)==="1"}catch(e){return false}};
const markSeen=()=>{try{localStorage.setItem(SEEN,"1")}catch(e){}};
function enter(){show(seen()?"home":"welcome")}
function finishIntro(){markSeen();show("home")}

$("track").replaceChildren(...SL.map(([e,h,p])=>{
  const d=document.createElement("div");d.className="slide";
  d.innerHTML=`<div class="hero">${e}</div><h2>${h}</h2><p>${p}</p>`;return d;
}));
$("dots").replaceChildren(...SL.map(()=>document.createElement("i")));
function slide(n){
  si=Math.max(0,Math.min(SL.length-1,n));
  $("track").style.transform=`translateX(${-si*100}%)`;
  [...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i===si));
  $("next").textContent=si===SL.length-1?"Mulai":"Lanjut";
}
$("next").onclick=()=>si===SL.length-1?finishIntro():slide(si+1);
$("skip").onclick=finishIntro;
$("help").onclick=()=>{slide(0);show("welcome")};
$("wview").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("wview").addEventListener("touchend",e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>40)slide(si+(d<0?1:-1))});
slide(0);

function renderHome(){
  const u=tg.initDataUnsafe&&tg.initDataUnsafe.user, nm=(u&&u.first_name)||"";
  $("hi").textContent=nm?`Halo, ${nm}`:"Halo";
  $("av").textContent=nm?[...nm][0].toUpperCase():"?";
  $("av").style.background=AV[0];
  $("glist").replaceChildren(...GAMES.map(g=>{
    const b=document.createElement("button");
    b.className="game";b.style.setProperty("--c",g.c);
    if(g.ok)b.dataset.ok="1";else b.disabled=true;
    b.innerHTML=`<span class="gico">${g.e}</span><span class="gtxt"><b>${g.n}</b><small>${g.d}</small><em>${g.ok?g.min+"–"+g.max+" pemain":"Segera hadir"}</em></span><span class="go" aria-hidden="true">›</span>`;
    b.onclick=()=>createRoom(g.id);
    return b;
  }));
}
function createRoom(id){
  if(pending)return;
  pending=true;hap("light");lock(true);
  if(!send({t:"create",game:id})){pending=false;lock(false);toast("Belum tersambung")}
}
$("join").oninput=e=>{e.target.value=e.target.value.toUpperCase()};
$("joinForm").onsubmit=e=>{
  e.preventDefault();
  const c=$("join").value.trim().toUpperCase();
  if(c.length!==5)return toast("Kodenya harus 5 karakter");
  hap("light");
  if(!send({t:"join",code:c}))toast("Belum tersambung");
};

function render(){
  const g=GAMES.find(x=>x.id===room.game), host=room.host===me, n=room.players.length;
  $("gname").textContent=g.n;
  $("code").textContent=room.code;
  $("seats").replaceChildren(...Array.from({length:g.max},(_,i)=>{
    const p=room.players[i], s=document.createElement("div"), a=document.createElement("div"), t=document.createElement("span");
    s.className="seat";
    a.className="av"+(p?"":" empty")+(p&&p.id===room.host?" host":"");
    if(p){a.style.background=AV[i%AV.length];a.textContent=[...p.name][0]||"?"}
    t.textContent=p?p.name+(p.id===me?" (kamu)":"")+(p.on?"":" (putus)"):"Kosong";
    if(!p||!p.on)t.classList.add("dim");
    s.append(a,t);return s;
  }));
  $("status").textContent=`${n} dari ${g.max} pemain. Minimal ${g.min} untuk mulai.`;
  $("start").hidden=!host||room.started;
  $("start").disabled=n<g.min;
  $("note").textContent=host?(n<g.min?"Tunggu teman masuk pakai kode di atas.":"Sudah cukup. Mulai game kalau semua siap."):"Menunggu tuan rumah memulai game.";
}

function renderPlay(){
  const st=room.state; if(!st)return;
  const host=room.host===me, mine=st.turn===me;
  const tp=room.players.find(p=>p.id===st.turn), tn=tp?tp.name:"...";
  $("pgame").textContent=GAMES.find(x=>x.id===room.game).n;
  $("pround").textContent="Putaran "+st.round;
  $("pturn").textContent=mine?"Giliran kamu":"Giliran "+tn;
  $("pchoose").hidden=!(mine&&st.phase==="choose");
  $("panswer").hidden=st.phase!=="answer";
  $("pkind").textContent=st.kind==="truth"?"Jujur":"Berani";
  $("pprompt").textContent=st.prompt||"";
  $("pdone").hidden=!mine;
  $("pwait").textContent=mine?"":st.phase==="choose"?`${tn} sedang memilih Jujur atau Berani.`:`Tunggu ${tn} selesai.`;
  $("pskip").hidden=$("pend").hidden=!host;
  $("pseats").replaceChildren(...room.players.map((p,i)=>{
    const s=document.createElement("div"), a=document.createElement("div"), t=document.createElement("span");
    s.className="seat";
    a.className="av"+(p.id===st.turn?" turn":"");
    a.style.background=AV[i%AV.length];
    a.textContent=[...p.name][0]||"?";
    t.textContent=p.name+(p.id===me?" (kamu)":"")+(p.on?"":" (putus)");
    if(!p.on)t.classList.add("dim");
    s.append(a,t);return s;
  }));
}

function connect(){
  ws=new WebSocket(location.origin.replace(/^http/,"ws")+"/ws");
  ws.onopen=()=>send({t:"auth",initData:tg.initData});
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==="ready"){
      me=m.me;bot=m.bot||"";tries=0;setLink(true);
      const want=room?room.code:(tg.initDataUnsafe.start_param||new URLSearchParams(location.search).get("code")||"").replace(/^room_/,"").toUpperCase();
      if(want)send({t:"join",code:want});else enter();
    }
    else if(m.t==="room"){room=m;pending=false;lock(false);render();if(room.state){renderPlay();show("play")}else show("lobby")}
    else if(m.t==="left"){room=null;show("home")}
    else if(m.t==="error"){pending=false;lock(false);toast(m.m);if(m.c==="notfound")room=null;if(!room&&(cur()==="splash"||cur()==="lobby"||cur()==="play"))enter()}
    else if(m.t==="fatal")gate(m.m);
  };
  ws.onclose=()=>{
    setLink(false);pending=false;lock(false);
    if(fatal)return;
    clearTimeout(retryT);
    retryT=setTimeout(connect,Math.min(1500*++tries,8000));
  };
}

function leaveRoom(){hap("light");if(!send({t:"leave"}))toast("Belum tersambung")}
$("start").onclick=()=>{hap("medium");send({t:"start"})};
$("leave").onclick=leaveRoom;
$("code").onclick=$("copy").onclick=()=>{hap("light");copy(room.code)};
$("share").onclick=()=>{
  hap("light");
  const g=GAMES.find(x=>x.id===room.game);
  const text=`Ayo main ${g.n} di Ngumpul! Kode room: ${room.code}`;
  const link=bot?`https://t.me/${bot}?start=room_${room.code}`:"";
  try{tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`)}catch(e){copy(room.code)}
};
$("tk").onclick=()=>{hap("light");send({t:"pick",kind:"truth"})};
$("dr").onclick=()=>{hap("light");send({t:"pick",kind:"dare"})};
$("pdone").onclick=()=>{hap("medium");send({t:"done"})};
$("pskip").onclick=()=>{hap("light");send({t:"skip"})};

$("pleave").onclick=leaveRoom;

show("splash");
if(tg&&tg.initData){
  tg.ready();tg.expand();
  try{tg.setHeaderColor("#1d1446");tg.setBackgroundColor("#1d1446")}catch(e){}
  try{tg.BackButton.onClick(()=>{if(room)leaveRoom()})}catch(e){}
  renderHome();
  connect();
  setTimeout(()=>{if(me===null&&!fatal)gate("Belum tersambung. Cek koneksi lalu coba lagi.")},8000);
}else gate("Buka Ngumpul lewat bot Telegram ya.");
